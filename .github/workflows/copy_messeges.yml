          mkdir -p 'app/src/main/java/com/example/chatcopier'
          cat > 'app/src/main/java/com/example/chatcopier/MainActivity.kt' <<'EOF'
          package com.example.chatcopier

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (18 * resources.displayMetrics.density).toInt()

                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(pad, pad * 2, pad, pad)
                  box.layoutDirection = View.LAYOUT_DIRECTION_RTL

                  val title = TextView(this)
                  title.textSize = 22f
                  title.text = "Geno Extension"
                  title.setTextColor(Color.parseColor("#06CF9C"))
                  box.addView(title)

                  val help = TextView(this)
                  help.textSize = 14f
                  help.setTextColor(Color.parseColor("#E9EDEF"))
                  help.setPadding(0, pad / 2, 0, pad / 2)
                  help.text = "نفس إضافة Geno بتاعة كروم، بس جوه واتساب على الموبايل.\n\n" +
                      "1) دوس \"فتح إعدادات الإتاحة\" وفعّل خدمة \"Geno\".\n" +
                      "   (لو الخيار رمادي: دوس \"إعدادات التطبيق\" ثم ⋮ ثم \"السماح بالإعدادات المقيّدة\"، وبعدها فعّل الخدمة.)\n\n" +
                      "2) افتح أي شات في واتساب، هتلاقي شعار Geno صغير عايم (تقدر تسحبه من ⋮⋮).\n\n" +
                      "3) دوس الشعار أو \"تحديد رسائل\": هتظهر دواير على طرف الشاشة جنب كل رسالة.\n\n" +
                      "4) دوس على الدايرة لتحديد/إلغاء رسالة. ضغطة طويلة على الدايرة = تحديد كل الرسائل من آخر دايرة دوستها لحد هنا (زي Shift في الإضافة).\n\n" +
                      "5) اسكرول براحة: التطبيق بيسجّل الرسائل اللي بتعدي قدامك (زي ما الإضافة بتفتكر الرسائل اللي ظهرت).\n\n" +
                      "6) من ⚙: تحديد سريع (كل الرسائل / رسائلي / رسائلهم)، خيارات النسخ، الفاصل، التفاعل بعد النسخ، تنزيل txt، وتشخيص.\n\n" +
                      "7) دوس \"نسخ\" والصق في أي مكان."
                  box.addView(help)

                  val b1 = Button(this)
                  b1.text = "فتح إعدادات الإتاحة"
                  b1.setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  box.addView(b1)

                  val b2 = Button(this)
                  b2.text = "إعدادات التطبيق"
                  b2.setOnClickListener {
                      startActivity(
                          Intent(
                              Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                              Uri.parse("package:" + packageName)
                          )
                      )
                  }
                  box.addView(b2)

                  box.addView(SettingsUi.build(this, true) {})

                  val scroll = ScrollView(this)
                  scroll.setBackgroundColor(Color.parseColor("#111B21"))
                  scroll.addView(box)
                  setContentView(scroll)
              }
          }
