          mkdir -p 'app/src/main/java/com/example/chatcopier'
          cat > 'app/src/main/java/com/example/chatcopier/Prefs.kt' <<'EOF'
          package com.example.chatcopier

          import android.content.Context

          object Prefs {
              // نفس فواصل الإضافة (\n بتتحول لسطر جديد وقت النسخ)
              const val SEP_LINE = "\\n----------\\n"
              const val SEP_STARS = "\\n**************\\n"
              const val SEP_BLANK = "\\n\\n"
              const val SEP_NL = "\\n"

              // تفاعلات واتساب الافتراضية (بدون رمز التنسيق FE0F)
              val EMOJIS = listOf("👍", "❤", "😂", "😮", "😢", "🙏")

              private fun sp(c: Context) = c.getSharedPreferences("geno", Context.MODE_PRIVATE)

              fun bool(c: Context, k: String): Boolean {
                  val d = (k == "integrate")
                  return sp(c).getBoolean(k, d)
              }

              fun setBool(c: Context, k: String, v: Boolean) {
                  sp(c).edit().putBoolean(k, v).apply()
              }

              fun str(c: Context, k: String, d: String): String {
                  return sp(c).getString(k, d) ?: d
              }

              fun setStr(c: Context, k: String, v: String) {
                  sp(c).edit().putString(k, v).apply()
              }

              fun int(c: Context, k: String, d: Int): Int {
                  return sp(c).getInt(k, d)
              }

              fun setInt(c: Context, k: String, v: Int) {
                  sp(c).edit().putInt(k, v).apply()
              }
          }
          EOF
          mkdir -p 'app/src/main/java/com/example/chatcopier'
