- name: Apply Geno update (range select + reactions fix)
        run: |
          cat > 'app/src/main/res/xml/accessibility_service_config.xml' <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewScrolled|typeViewClicked|typeViewLongClicked"
              android:accessibilityFeedbackType="feedbackGeneric"
