          import kotlin.coroutines.resume
          
          // "اقرأ المزيد" في آخر الرسالة (لازم يسبقها ...)
          private val RM_RE = Regex(
              "(…|\\.\\.\\.)[\\s\\u200e\\u200f]*(read more|عرض المزيد|اقرأ المزيد|قراءة المزيد|عرض الكل)[\\s\\u200e\\u200f.…]*\$",
              RegexOption.IGNORE_CASE
          )
          
          // علامات الرسالة الصادرة (حالة الإرسال)
          private val OUT_LABEL = Regex(
              "^\\s*(sent|delivered|read|pending|تم الإرسال|تم التسليم|تمت القراءة|قيد الانتظار|مرسلة|تم الارسال)\\s*\$",
              RegexOption.IGNORE_CASE
          )
          
          private class Msg(val id: Int) {
              var text = ""
              var key = ""
              var trunc = false
              var mine = false
              var time = ""
              var date = ""
              var sender = ""
              var quoted = ""
              // في فجوة (رسايل لسه متشافتش) بعد الرسالة دي مباشرة
              var gapAfter = false
          }
          
          private class Entry(
              val text: String,
              val mine: Boolean,
              val time: String,
              val date: String,
              val sender: String,
              val quoted: String,
              val body: AccessibilityNodeInfo,
              val row: Rect
          ) {
              val trunc: Boolean = RM_RE.containsMatchIn(text)
              val key: String = if (trunc) RM_RE.replace(text, "").trim() else text
              var msg: Msg? = null
          }
          
          private class Snap(
              val entries: List<Entry>,
              val listRect: Rect,
              val list: AccessibilityNodeInfo,
              val title: String,
              val group: Boolean
          )
          
          private class RowScan {
              var body: AccessibilityNodeInfo? = null
              var bodyText = ""
              var time = ""
              var sender = ""
              var quoted = ""
              var mine = false
              var divider = ""
          }
          
          private class TreeWalk {
              var list: AccessibilityNodeInfo? = null
              var listH = 0
              var title = ""
          }
          
          private class Out(val text: String, val count: Int, val skipped: Int)
          
          /** عمود دواير التحديد على طرف الشاشة. */
          private class StripView(ctx: Context) : View(ctx) {
              var items: List<Pair<Rect, Int>> = emptyList()
              var selectedIds: Set<Int> = emptySet()
              var anchorId = -1
              var listTop = 0
              var listBottom = 0
              var onTap: ((Int, Boolean) -> Unit)? = null
          
              private val dens = ctx.resources.displayMetrics.density
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val green = Color.parseColor("#00A884")
              private val orange = Color.parseColor("#FFB300")
              private val dark = Color.parseColor("#CC111B21")
              private val gray = Color.parseColor("#8696A0")
              private var downT = 0L
          
              override fun onDraw(c: Canvas) {
                  val loc = IntArray(2)
                  getLocationOnScreen(loc)
                  val cx = width / 2f
                  val rad = 11f * dens
                  for (it in items) {
                      val r = it.first
                      val top = maxOf(r.top, listTop)
                      val bot = minOf(r.bottom, listBottom)
                      if (bot - top < 14 * dens) continue
                      val cy = (top + bot) / 2f - loc[1]
                      val sel = selectedIds.contains(it.second)
                      val col = if (it.second == anchorId) orange else green
                      paint.style = Paint.Style.FILL
                      paint.color = if (sel) col else dark
                      c.drawCircle(cx, cy, rad, paint)
                      paint.style = Paint.Style.STROKE
                      paint.strokeWidth = 2f * dens
                      paint.color = if (sel) col else gray
                      c.drawCircle(cx, cy, rad, paint)
                      if (sel) {
                          paint.color = Color.WHITE
                          paint.strokeWidth = 2.2f * dens
                          c.drawLine(cx - 5f * dens, cy, cx - 1.5f * dens, cy + 4f * dens, paint)
                          c.drawLine(cx - 1.5f * dens, cy + 4f * dens, cx + 5.5f * dens, cy - 4f * dens, paint)
                      }
                  }
              }
          
              override fun onTouchEvent(ev: MotionEvent): Boolean {
                  if (ev.action == MotionEvent.ACTION_DOWN) {
                      downT = ev.eventTime
                      return true
                  }
                  if (ev.action == MotionEvent.ACTION_UP) {
                      val y = ev.rawY.toInt()
                      var hit: Int = -1
                      for (it in items) {
                          val top = maxOf(it.first.top, listTop)
                          val bot = minOf(it.first.bottom, listBottom)
                          if (y >= top && y <= bot) {
                              hit = it.second
                              break
                          }
                      }
                      if (hit >= 0) {
                          val longPress = (ev.eventTime - downT) > 450L
                          onTap?.invoke(hit, longPress)
                      }
                      return true
                  }
                  return true
              }
          }
          
          /** تظليل الرسائل المحددة (مش بيمسك اللمس). */
          private class HiView(ctx: Context) : View(ctx) {
              var items: List<Pair<Rect, Int>> = emptyList()
              var selectedIds: Set<Int> = emptySet()
              var listTop = 0
              var listBottom = 0
              private val paint = Paint()
          
              init {
                  paint.color = Color.parseColor("#2800A884")
              }
          
              override fun onDraw(c: Canvas) {
                  val loc = IntArray(2)
                  getLocationOnScreen(loc)
                  for (it in items) {
                      if (!selectedIds.contains(it.second)) continue
                      val top = maxOf(it.first.top, listTop) - loc[1]
                      val bot = minOf(it.first.bottom, listBottom) - loc[1]
                      if (bot <= top) continue
                      c.drawRect(0f, top.toFloat(), width.toFloat(), bot.toFloat(), paint)
                  }
              }
          }
          
          class WaService : AccessibilityService() {
          
              private lateinit var wm: WindowManager
              private lateinit var panel: LinearLayout
              private lateinit var lp: WindowManager.LayoutParams
              private lateinit var pop: ScrollView
              private lateinit var popBox: LinearLayout
              private lateinit var status: TextView
              private lateinit var bar: LinearLayout
              private lateinit var grip: TextView
              private lateinit var logo: ImageView
              private lateinit var toggle: Button
              private lateinit var startB: Button
              private lateinit var endB: Button
              private lateinit var count: TextView
              private lateinit var copyB: Button
              private lateinit var gearB: Button
              private lateinit var stopB: Button
              private lateinit var hiView: HiView
              private lateinit var stripView: StripView
              private lateinit var hiLp: WindowManager.LayoutParams
              private lateinit var stripLp: WindowManager.LayoutParams
          
              private var shown = false
              private var overlayShown = false
              private var popOpen = false
              private var on = false
              private var busy = false
              private var refreshQueued = false
              private val handler = Handler(Looper.getMainLooper())
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main)
              private var job: Job? = null
          
              // كل الرسائل اللي اتشافت مرتبة (من الأقدم للأحدث). gapAfter = في فجوة بعد الرسالة.
              private val chat = ArrayList<Msg>()
              // تحديد فردي
              private val selected = LinkedHashSet<Int>()
              // مدى (بداية/نهاية) — بيتحسب وقت النسخ فبيشمل أي رسايل اتضافت في الفجوات بعدين
              private val ranges = ArrayList<IntArray>()
              // رسائل اتلغى تحديدها من جوه مدى
              private val excluded = HashSet<Int>()
              private val reacted = HashSet<String>()
              private val redirects = HashMap<Int, Int>()
              private var nextId = 1
              private var lastPicked = -1
              private var armed = 0 // 0 عادي، 1 مستني دايرة البداية، 2 مستني دايرة النهاية
              private var rangeStartId = -1
              private var dirHint = -1 // 1 = بنسكرول ناحية الأحدث، -1 = ناحية الأقدم
              private var curMsgId = -1
              private var prevFirstId = -1
              private var curTitle = ""
              private var isGroup = false
              private var lastSnap: Snap? = null
              private var lastDump = ""
              private var imePkgs: Set<String>? = null
              private val clearStatusRun = Runnable { setStatus("") }
          
              // ---------------------------------------------------------------- lifecycle
          
              override fun onServiceConnected() {
                  super.onServiceConnected()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  hiView = HiView(this)
                  stripView = StripView(this)
                  stripView.onTap = { id, range -> pick(id, range) }
                  buildPanel()
                  applyUi()
                  val r = rootInActiveWindow
                  if (isWa(r?.packageName?.toString())) showPanel()
              }
          
              override fun onInterrupt() {}
          
              override fun onDestroy() {
                  job?.cancel()
                  scope.cancel()
                  hideOverlay()
                  hidePanel()
                  super.onDestroy()
              }
          
              private fun isWa(pkg: String?): Boolean = pkg != null && pkg.startsWith("com.whatsapp")
          
              private fun imePackages(): Set<String> {
                  val cached = imePkgs
                  if (cached != null) return cached
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                  val s = imm.enabledInputMethodList.map { it.packageName }.toSet()
                  imePkgs = s
                  return s
              }
          
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null) return
                  val pkg = e.packageName?.toString()
                  when (e.eventType) {
                      AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED -> {
                          if (isWa(pkg)) {
                              showPanel()
                              if (on && !busy) scheduleRefresh()
                          } else if (pkg != null && pkg != packageName &&
                              pkg != "com.android.systemui" && pkg !in imePackages()
                          ) {
                              hidePanel()
                              hideOverlay()
                          }
                      }
                      AccessibilityEvent.TYPE_VIEW_CLICKED -> {
                          if (isWa(pkg) && on && !busy && Prefs.bool(this, "clickAnywhere")) {
                              val src = e.source
                              if (src != null) {
                                  val r = Rect()
                                  src.getBoundsInScreen(r)
                                  val cx = r.centerX()
                                  val cy = r.centerY()
                                  handler.postDelayed({ clickPick(cx, cy) }, 80)
                              }
                          }
                      }
                      AccessibilityEvent.TYPE_VIEW_SCROLLED,
                      AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED -> {
                          if (e.eventType == AccessibilityEvent.TYPE_VIEW_SCROLLED && isWa(pkg) &&
                              Build.VERSION.SDK_INT >= 28
                          ) {
                              val dy = e.scrollDeltaY
                              if (dy > 0) dirHint = 1 else if (dy < 0) dirHint = -1
                          }
                          if (on && !busy && isWa(pkg)) scheduleRefresh()
                      }
                  }
              }
          
              private fun scheduleRefresh() {
                  if (refreshQueued) return
                  refreshQueued = true
                  handler.postDelayed({
                      refreshQueued = false
                      if (on && !busy) refreshNow()
                  }, 70)
              }
          
              // ---------------------------------------------------------------- قراءة الرسائل من الشاشة
          
              private fun walkRoot(n: AccessibilityNodeInfo, w: TreeWalk, depth: Int) {
                  if (depth > 40) return
                  val id = n.viewIdResourceName ?: ""
                  if (w.title.isEmpty() && id.contains("conversation_contact_name")) {
                      w.title = n.text?.toString()?.trim() ?: ""
                  }
                  if (n.isScrollable) {
                      val r = Rect()
                      n.getBoundsInScreen(r)
                      if (r.height() > w.listH) {
                          w.listH = r.height()
                          w.list = n
                      }
                  }
                  for (i in 0 until n.childCount) {
                      val c = n.getChild(i) ?: continue
                      walkRoot(c, w, depth + 1)
                  }
              }
          
              private fun scanRow(n: AccessibilityNodeInfo, r: RowScan, depth: Int) {
                  if (depth > 25) return
                  val id = n.viewIdResourceName ?: ""
                  val t = n.text?.toString()?.trim() ?: ""
                  if (id.endsWith(":id/message_text") || id.endsWith(":id/caption")) {
                      if (r.body == null && t.isNotEmpty() && n.isVisibleToUser) {
                          r.body = n
                          r.bodyText = t
                      }
                  } else if (id.endsWith(":id/date")) {
                      if (r.time.isEmpty()) r.time = t
                  } else if (id.contains("name_in_group")) {
                      if (r.sender.isEmpty()) r.sender = t
                  } else if (id.contains("quoted_text")) {
                      if (r.quoted.isEmpty()) r.quoted = t
                  } else if (id.contains("date_divider")) {
                      r.divider = t
                  } else if (id.endsWith(":id/status")) {
                      r.mine = true
                  }
                  val d = n.contentDescription?.toString() ?: ""
                  if (d.isNotEmpty() && d.length < 30) {
                      val clean = d.replace("\u200e", "").replace("\u200f", "")
                      if (OUT_LABEL.matches(clean)) r.mine = true
                  }
                  for (i in 0 until n.childCount) {
                      val c = n.getChild(i) ?: continue
                      scanRow(c, r, depth + 1)
                  }
              }
          
              /** يقرا الرسائل الظاهرة دلوقتي. بيرجّع null لو مش في شات. */
              private fun readWindow(): Snap? {
                  val root = rootInActiveWindow ?: return null
                  if (!isWa(root.packageName?.toString())) return null
                  val w = TreeWalk()
                  walkRoot(root, w, 0)
                  val list = w.list ?: return null
                  val lr = Rect()
                  list.getBoundsInScreen(lr)
                  val out = ArrayList<Entry>()
                  var date = ""
                  var anyGroup = false
                  for (i in 0 until list.childCount) {
                      val row = list.getChild(i) ?: continue
                      val rs = RowScan()
                      scanRow(row, rs, 0)
                      if (rs.divider.isNotEmpty()) date = rs.divider
                      val body = rs.body ?: continue
                      if (rs.sender.isNotEmpty()) anyGroup = true
                      val rr = Rect()
                      row.getBoundsInScreen(rr)
                      out.add(Entry(rs.bodyText, rs.mine, rs.time, date, rs.sender, rs.quoted, body, rr))
                  }
                  return Snap(out, lr, list, w.title, anyGroup)
              }
          
              private fun sameMsg(m: Msg, e: Entry): Boolean {
                  if (m.key == e.key) return true
                  if (m.trunc || e.trunc) {
                      return m.key.startsWith(e.key) || e.key.startsWith(m.key)
                  }
                  return false
              }
          
              private fun sameMsgs(a: Msg, b: Msg): Boolean {
                  if (a.key == b.key) return true
                  if (a.trunc || b.trunc) {
                      return a.key.startsWith(b.key) || b.key.startsWith(a.key)
                  }
                  return false
              }
          
              private fun newMsg(e: Entry): Msg {
                  val m = Msg(nextId)
                  nextId++
                  m.text = e.text
                  m.key = e.key
                  m.trunc = e.trunc
                  m.mine = e.mine
                  m.time = e.time
                  m.date = e.date
                  m.sender = e.sender
                  m.quoted = e.quoted
                  return m
              }
          
              private fun updateMsg(m: Msg, e: Entry) {
                  if (m.trunc && !e.trunc) {
                      m.text = e.text
                      m.key = e.key
                      m.trunc = false
                  }
                  if (e.mine) m.mine = true
                  if (m.time.isEmpty()) m.time = e.time
                  if (m.date.isEmpty()) m.date = e.date
                  if (m.sender.isEmpty()) m.sender = e.sender
                  if (m.quoted.isEmpty()) m.quoted = e.quoted
              }
          
              private fun mergeInfo(keep: Msg, drop: Msg) {
                  if (keep.trunc && !drop.trunc) {
                      keep.text = drop.text
                      keep.key = drop.key
                      keep.trunc = false
                  }
                  if (drop.mine) keep.mine = true
                  if (keep.time.isEmpty()) keep.time = drop.time
                  if (keep.date.isEmpty()) keep.date = drop.date
                  if (keep.sender.isEmpty()) keep.sender = drop.sender
                  if (keep.quoted.isEmpty()) keep.quoted = drop.quoted
              }
          
              private fun idxOf(id: Int): Int {
                  for (i in chat.indices) {
                      if (chat[i].id == id) return i
                  }
                  return -1
              }
          
              private fun visibleMsgs(s: Snap): List<Msg> {
                  val out = ArrayList<Msg>()
                  for (en in s.entries) {
                      val m = en.msg
                      if (m != null) out.add(m)
                  }
                  return out
              }
          
              // ---------------------------------------------------------------- دمج الرسائل (مقاطع + فجوات)
          
              /** المقاطع المتصلة: كل مقطع [أول، آخر] بدون فجوات جواه. */
              private fun runBounds(): List<IntArray> {
                  val out = ArrayList<IntArray>()
                  var s = 0
                  for (i in chat.indices) {
                      if (chat[i].gapAfter || i == chat.size - 1) {
                          out.add(intArrayOf(s, i))
                          s = i + 1
                      }
                  }
                  return out
              }
          
              /** يطابق الرسايل الظاهرة مع مقطع. يرجّع [الإزاحة، عدد المتطابق] أو null. */
              private fun alignRun(w: List<Entry>, rs: Int, re: Int): IntArray? {
                  val n = re - rs + 1
                  if (w.isEmpty() || n <= 0) return null
                  val need = minOf(2, w.size, n)
                  var best = 0
                  var bestD = 0
                  var found = false
                  for (d in -(w.size - 1) until n) {
                      val from = maxOf(0, -d)
                      val to = minOf(w.size, n - d)
                      val cnt = to - from
                      if (cnt < need || cnt <= best) continue
                      var ok = true
                      for (t in from until to) {
                          if (!sameMsg(chat[rs + d + t], w[t])) {
                              ok = false
                              break
                          }
                      }
                      if (ok) {
                          best = cnt
                          bestD = d
                          found = true
                      }
                  }
                  return if (found) intArrayOf(bestD, best) else null
              }
          
              private fun mergeIntoRun(w: List<Entry>, run: IntArray, d: Int) {
                  val rs = run[0]
                  val re = run[1]
                  val n = re - rs + 1
                  val pre = ArrayList<Msg>()
                  val post = ArrayList<Msg>()
                  for (t in w.indices) {
                      val idx = d + t
                      if (idx >= 0 && idx < n) {
                          val m = chat[rs + idx]
                          updateMsg(m, w[t])
                          w[t].msg = m
                      } else {
                          val m = newMsg(w[t])
                          w[t].msg = m
                          if (idx < 0) pre.add(m) else post.add(m)
                      }
                  }
                  if (post.isNotEmpty()) {
                      val oldGap = chat[re].gapAfter
                      chat[re].gapAfter = false
                      chat.addAll(re + 1, post)
                      post[post.size - 1].gapAfter = oldGap
                  }
                  if (pre.isNotEmpty()) chat.addAll(rs, pre)
              }
          
              /** الرسايل الظاهرة مفيهاش تداخل مع أي مقطع: بنعمل مقطع جديد حسب اتجاه السكرول. */
              private fun addRun(w: List<Entry>, runs: List<IntArray>) {
                  var runIdx = runs.size - 1
                  val ci = if (curMsgId >= 0) idxOf(curMsgId) else -1
                  if (ci >= 0) {
                      for (ri in runs.indices) {
                          if (ci >= runs[ri][0] && ci <= runs[ri][1]) runIdx = ri
                      }
                  }
                  val msgs = ArrayList<Msg>()
                  for (e in w) {
                      val m = newMsg(e)
                      e.msg = m
                      msgs.add(m)
                  }
                  if (dirHint >= 0) {
                      val p = runs[runIdx][1] + 1
                      val oldGap = chat[p - 1].gapAfter
                      chat[p - 1].gapAfter = true
                      chat.addAll(p, msgs)
                      msgs[msgs.size - 1].gapAfter = oldGap
                  } else {
                      val p = runs[runIdx][0]
                      chat.addAll(p, msgs)
                      msgs[msgs.size - 1].gapAfter = true
                  }
              }
          
              private fun overlapLen(a: IntArray, b: IntArray): Int {
                  val maxK = minOf(a[1] - a[0] + 1, b[1] - b[0] + 1)
                  for (k in maxK downTo 1) {
                      var ok = true
                      for (t in 0 until k) {
                          if (!sameMsgs(chat[a[1] - k + 1 + t], chat[b[0] + t])) {
                              ok = false
                              break
                          }
                      }
                      if (ok && (k >= 2 || chat[b[0]].key.length >= 12)) return k
                  }
                  return 0
              }
          
              private fun remap(from: Int, to: Int) {
                  if (selected.remove(from)) selected.add(to)
                  if (excluded.remove(from)) excluded.add(to)
                  if (lastPicked == from) lastPicked = to
                  if (rangeStartId == from) rangeStartId = to
                  if (curMsgId == from) curMsgId = to
                  if (prevFirstId == from) prevFirstId = to
                  for (r in ranges) {
                      if (r[0] == from) r[0] = to
                      if (r[1] == from) r[1] = to
                  }
                  val rem = ArrayList<String>()
                  val add = ArrayList<String>()
                  for (k in reacted) {
                      if (k.startsWith("$from|")) {
                          rem.add(k)
                          add.add("$to|" + k.substring(k.indexOf('|') + 1))
                      }
                  }
                  for (k in rem) reacted.remove(k)
                  reacted.addAll(add)
              }
          
              private fun joinRuns(a: IntArray, b: IntArray, k: Int) {
                  val bLastGap = chat[b[1]].gapAfter
                  val bLen = b[1] - b[0] + 1
                  for (t in 0 until k) {
                      val keep = chat[a[1] - k + 1 + t]
                      val drop = chat[b[0] + t]
                      mergeInfo(keep, drop)
                      remap(drop.id, keep.id)
                      redirects[drop.id] = keep.id
                  }
                  chat.subList(b[0], b[0] + k).clear()
                  chat[a[1]].gapAfter = if (k == bLen) bLastGap else false
              }
          
              /** لو مقطعين اتقابلوا (بعد ما الشاشة غطت الفجوة) بيتدمجوا في مقطع واحد. */
              private fun joinAll() {
                  var i = 0
                  var guard = 0
                  while (guard < 500) {
                      guard++
                      val runs = runBounds()
                      if (i >= runs.size - 1) break
                      val a = runs[i]
                      val b = runs[i + 1]
                      val k = overlapLen(a, b)
                      if (k > 0) joinRuns(a, b, k) else i++
                  }
              }
          
              private fun finishMerge(w: List<Entry>) {
                  redirects.clear()
                  joinAll()
                  if (redirects.isNotEmpty()) {
                      for (e in w) {
                          val m = e.msg ?: continue
                          var id = m.id
                          var hop = 0
                          while (redirects.containsKey(id) && hop < 20) {
                              id = redirects[id] ?: id
                              hop++
                          }
                          if (id != m.id) {
                              val i = idxOf(id)
                              if (i >= 0) e.msg = chat[i]
                          }
                      }
                  }
                  val f = w[0].msg
                  val l = w[w.size - 1].msg
                  if (f != null) {
                      if (prevFirstId >= 0) {
                          val pi = idxOf(prevFirstId)
                          val ni = idxOf(f.id)
                          if (pi >= 0 && ni >= 0 && pi != ni) dirHint = if (ni > pi) 1 else -1
                      }
                      prevFirstId = f.id
                  }
                  if (l != null) curMsgId = l.id
              }
          
              /** يدمج الرسائل الظاهرة في قايمة المحادثة. مفيش حاجة اسمها فشل: لو في فجوة بنسجّلها ونكمل. */
              private fun mergeEntries(w: List<Entry>) {
                  if (w.isEmpty()) return
                  if (chat.isEmpty()) {
                      for (e in w) {
                          val m = newMsg(e)
                          chat.add(m)
                          e.msg = m
                      }
                      finishMerge(w)
                      return
                  }
                  val runs = runBounds()
                  var bestRun = -1
                  var bestCnt = 0
                  var bestD = 0
                  for (ri in runs.indices) {
                      val a = alignRun(w, runs[ri][0], runs[ri][1]) ?: continue
                      if (a[1] > bestCnt) {
                          bestCnt = a[1]
                          bestRun = ri
                          bestD = a[0]
                      }
                  }
                  if (bestRun >= 0) mergeIntoRun(w, runs[bestRun], bestD) else addRun(w, runs)
                  finishMerge(w)
              }
          
              private fun resetAll() {
                  chat.clear()
                  selected.clear()
                  ranges.clear()
                  excluded.clear()
                  reacted.clear()
                  lastPicked = -1
                  rangeStartId = -1
                  armed = 0
                  curMsgId = -1
                  prevFirstId = -1
                  isGroup = false
              }
          
              private fun refreshNow(): Snap? {
                  val snap = readWindow()
                  if (snap == null) {
                      hideOverlay()
                      return null
                  }
                  if (snap.title.isNotEmpty()) {
                      if (curTitle.isNotEmpty() && snap.title != curTitle &&
                          (chat.isNotEmpty() || selected.isNotEmpty() || ranges.isNotEmpty())
                      ) {
                          if (selSet().isNotEmpty()) toast("اتمسح التحديد لأن المحادثة اتغيرت", false)
                          resetAll()
                      }
                      curTitle = snap.title
                  }
                  if (snap.group) isGroup = true
                  mergeEntries(snap.entries)
                  lastSnap = snap
                  updateOverlay(snap)
                  applyUi()
                  return snap
              }
          
              // ---------------------------------------------------------------- التحديد
          
              /** كل الرسايل المحددة (فردي + المدى) ناقص اللي اتلغى. */
              private fun selSet(): Set<Int> {
                  val s = HashSet<Int>(selected)
                  for (r in ranges) {
                      val a = idxOf(r[0])
                      val b = idxOf(r[1])
                      if (a < 0 || b < 0) continue
                      for (i in minOf(a, b)..maxOf(a, b)) s.add(chat[i].id)
                  }
                  for (x in excluded) s.remove(x)
                  return s
              }
          
              /** مواضع الفجوات (بعد الرسالة رقم j) اللي واقعة جوه مدى محدد. */
              private fun rangeGaps(): List<Int> {
                  val out = ArrayList<Int>()
                  val seen = HashSet<Int>()
                  for (r in ranges) {
                      val a = idxOf(r[0])
                      val b = idxOf(r[1])
                      if (a < 0 || b < 0) continue
                      val lo = minOf(a, b)
                      val hi = maxOf(a, b)
                      for (j in lo until hi) {
                          if (chat[j].gapAfter && seen.add(j)) out.add(j)
                      }
                  }
                  return out
              }
          
              private fun setOn(v: Boolean) {
                  on = v
                  if (v) {
                      refreshNow()
                  } else {
                      resetAll()
                      curTitle = ""
                      setStatus("")
                      hideOverlay()
                  }
                  applyUi()
                  if (popOpen) buildPop()
              }
          
              private fun afterPick() {
                  applyUi()
                  val s = lastSnap
                  if (s != null) updateOverlay(s)
              }
          
              private fun addRange(a: Int, b: Int) {
                  ranges.add(intArrayOf(a, b))
                  val ia = idxOf(a)
                  val ib = idxOf(b)
                  if (ia >= 0 && ib >= 0) {
                      for (i in minOf(ia, ib)..maxOf(ia, ib)) excluded.remove(chat[i].id)
                  }
              }
          
              private fun pick(id: Int, longPress: Boolean) {
                  // زر "بداية": الدايرة الجاية هي أول الرسايل
                  if (armed == 1 || (armed == 2 && rangeStartId < 0)) {
                      rangeStartId = id
                      excluded.remove(id)
                      selected.add(id)
                      lastPicked = id
                      armed = 2
                      setStatus("تمام ✓ اسكرول لآخر رسالة وادوس على دايرتها", true)
                      afterPick()
                      return
                  }
                  // زر "نهاية": الدايرة الجاية هي آخر الرسايل، وكل اللي بينهم يتحدد
                  if (armed == 2) {
                      addRange(rangeStartId, id)
                      selected.add(id)
                      lastPicked = id
                      rangeStartId = -1
                      armed = 0
                      setStatus("")
                      afterPick()
                      return
                  }
                  val s = selSet()
                  val state = !s.contains(id)
                  val a = idxOf(id)
                  val b = if (lastPicked >= 0) idxOf(lastPicked) else -1
                  if (longPress && a >= 0 && b >= 0) {
                      if (state) {
                          addRange(lastPicked, id)
                          selected.add(id)
                      } else {
                          for (i in minOf(a, b)..maxOf(a, b)) {
                              selected.remove(chat[i].id)
                              excluded.add(chat[i].id)
                          }
                      }
                  } else {
                      if (state) {
                          excluded.remove(id)
                          selected.add(id)
                      } else {
                          selected.remove(id)
                          excluded.add(id)
                      }
                  }
                  lastPicked = id
                  afterPick()
              }
          
              private fun onStartBtn() {
                  if (armed == 1) {
                      armed = 0
                      setStatus("")
                  } else {
                      armed = 1
                      rangeStartId = -1
                      setStatus("دوس على دايرة أول رسالة (البداية)", true)
                  }
                  applyUi()
                  val s = lastSnap
                  if (s != null) updateOverlay(s)
              }
          
              private fun onEndBtn() {
                  if (armed == 2 && rangeStartId >= 0) {
                      armed = 0
                      setStatus("")
                  } else if (rangeStartId >= 0) {
                      armed = 2
                      setStatus("دوس على دايرة آخر رسالة (النهاية)", true)
                  } else if (lastPicked >= 0 && selSet().contains(lastPicked)) {
                      // آخر رسالة حددتها تبقى هي البداية
                      rangeStartId = lastPicked
                      armed = 2
                      setStatus("دوس على دايرة آخر رسالة (النهاية)", true)
                  } else {
                      armed = 1
                      setStatus("حدد البداية الأول: دوس على دايرة أول رسالة", true)
                  }
                  applyUi()
                  val s = lastSnap
                  if (s != null) updateOverlay(s)
              }
          
              private fun clickPick(x: Int, y: Int) {
                  if (!on || busy) return
                  val snap = refreshNow() ?: return
                  for (e in snap.entries) {
                      val m = e.msg ?: continue
                      if (e.row.contains(x, y)) {
                          pick(m.id, false)
                          return
                      }
                  }
              }
          
              private fun selectWhere(f: (Msg) -> Boolean) {
                  if (!on) setOn(true)
                  refreshNow()
                  for (m in chat) {
                      if (f(m)) {
                          excluded.remove(m.id)
                          selected.add(m.id)
                      }
                  }
                  afterPick()
              }
          
              private fun clearSelection() {
                  selected.clear()
                  ranges.clear()
                  excluded.clear()
                  lastPicked = -1
                  rangeStartId = -1
                  armed = 0
                  setStatus("")
                  afterPick()
              }
          
              // ---------------------------------------------------------------- الإخراج
          
              /** اسم المرسل للرسائل اللي مفيهاش اسم (واتساب بيخفيه في الرسائل المتتالية). */
              private fun resolveSenders() {
                  var lastIn = ""
                  for (m in chat) {
                      if (m.mine) {
                          lastIn = ""
                      } else if (m.sender.isNotEmpty()) {
                          lastIn = m.sender
                      } else if (isGroup) {
                          if (lastIn.isNotEmpty()) m.sender = lastIn
                      } else if (curTitle.isNotEmpty()) {
                          m.sender = curTitle
                      }
                      if (m.gapAfter) lastIn = ""
                  }
              }
          
              private fun cleanText(m: Msg): String {
                  return RM_RE.replace(m.text, "").trim()
              }
          
              private fun buildOutput(): Out {
                  resolveSenders()
                  val sel = selSet()
                  val sep = Prefs.str(this, "sep", Prefs.SEP_LINE).replace("\\n", "\n")
                  val showSender = Prefs.bool(this, "sender")
                  val showTime = Prefs.bool(this, "time")
                  val numbered = Prefs.bool(this, "number")
                  val showQuoted = Prefs.bool(this, "quoted")
                  val lines = ArrayList<String>()
                  var skipped = 0
                  for (m in chat) {
                      if (!sel.contains(m.id)) continue
                      val body = cleanText(m)
                      if (body.isEmpty()) {
                          skipped++
                          continue
                      }
                      val sb = StringBuilder()
                      if (numbered) sb.append(lines.size + 1).append(". ")
                      if (showTime && m.time.isNotEmpty()) {
                          sb.append("[")
                          sb.append(m.time)
                          if (m.date.isNotEmpty()) sb.append(", ").append(m.date)
                          sb.append("] ")
                      }
                      if (showSender) {
                          val s = if (m.mine) "أنا" else m.sender
                          if (s.isNotEmpty()) sb.append(s).append(": ")
                      }
                      sb.append(body)
                      var line = sb.toString()
                      if (showQuoted && m.quoted.isNotEmpty()) line = "↪ " + m.quoted + "\n" + line
                      lines.add(line)
                  }
                  return Out(lines.joinToString(sep), lines.size, skipped)
              }
          
              private fun writeClipboard(text: String): Boolean {
                  return try {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("messages", text))
                      true
                  } catch (e: Exception) {
                      false
                  }
              }
          
              private fun saveTxt(text: String): Boolean {
                  val name = "whatsapp-messages-" + System.currentTimeMillis() + ".txt"
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          val v = ContentValues()
                          v.put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                          v.put(MediaStore.MediaColumns.MIME_TYPE, "text/plain")
                          v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                          val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v)
                          if (uri == null) return false
                          val os = contentResolver.openOutputStream(uri)
                          if (os == null) return false
                          os.use { it.write(text.toByteArray(Charsets.UTF_8)) }
                          return true
                      }
                      val i = Intent(Intent.ACTION_SEND)
                      i.type = "text/plain"
                      i.putExtra(Intent.EXTRA_TEXT, text)
                      val ch = Intent.createChooser(i, "حفظ / مشاركة")
                      ch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(ch)
                      return true
                  } catch (e: Exception) {
                      return false
                  }
              }
          
              private fun toast(msg: String, long: Boolean) {
                  Toast.makeText(applicationContext, msg, if (long) Toast.LENGTH_LONG else Toast.LENGTH_SHORT).show()
              }
          
              // ---------------------------------------------------------------- فتح "اقرأ المزيد" والسكرول
          
              private fun limitBottomOf(list: Rect): Int {
                  val loc = IntArray(2)
                  panel.getLocationOnScreen(loc)
                  val b = if (shown && loc[1] > list.centerY()) minOf(list.bottom, loc[1]) else list.bottom
                  return b - 6
              }
          
              private fun truncIds(): List<Int> {
                  val sel = selSet()
                  val out = ArrayList<Int>()
                  for (m in chat) {
                      if (m.trunc && sel.contains(m.id)) out.add(m.id)
                  }
                  return out
              }
          
              private suspend fun clickReadMore(e: Entry) {
                  var a: AccessibilityNodeInfo? = e.body
                  var up = 0
                  var ok = false
                  while (a != null && up < 4 && !ok) {
                      if (a.isClickable) ok = a.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      a = a.parent
                      up++
                  }
                  if (!ok) {
                      val r = Rect()
                      e.body.getBoundsInScreen(r)
                      val p = Path()
                      p.moveTo(r.right - dp(40).toFloat(), r.bottom - dp(10).toFloat())
                      gesture(p, 60)
                  }
              }
          
              private suspend fun expandVisible(ids: Set<Int>) {
                  val tries = HashMap<Int, Int>()
                  var backed = false
                  for (round in 0 until 40) {
                      val snap = readWindow()
                      if (snap == null) {
                          if (!backed) {
                              backed = true
                              performGlobalAction(GLOBAL_ACTION_BACK)
                              delay(700)
                              continue
                          }
                          return
                      }
                      mergeEntries(snap.entries)
                      var target: Entry? = null
                      for (en in snap.entries) {
                          val m = en.msg ?: continue
                          val n = tries[m.id] ?: 0
                          if (ids.contains(m.id) && m.trunc && en.trunc && n < 2) {
                              target = en
                              break
                          }
                      }
                      if (target == null) return
                      val tm = target.msg
                      if (tm != null) tries[tm.id] = (tries[tm.id] ?: 0) + 1
                      clickReadMore(target)
                      delay(700)
                  }
              }
          
              private suspend fun bringIntoView(id: Int, steps: Int): Boolean {
                  var same = 0
                  var lastFirst = -1
                  for (i in 0 until steps) {
                      val snap = readWindow() ?: return false
                      mergeEntries(snap.entries)
                      val vis = visibleMsgs(snap)
                      for (m in vis) {
                          if (m.id == id) return true
                      }
                      if (vis.isEmpty()) return false
                      val first = idxOf(vis[0].id)
                      val target = idxOf(id)
                      if (target < 0) return false
                      val older = target < first
                      if (first == lastFirst) {
                          same++
                          if (same >= 3) return false
                      } else {
                          same = 0
                      }
                      lastFirst = first
                      dirHint = if (older) -1 else 1
                      swipe(snap.listRect, limitBottomOf(snap.listRect), older)
                      delay(450)
                  }
                  return false
              }
          
              /** بيملا أي فجوة جوه المدى المحدد: بيسكرول براحة لحد ما الرسايل تتوصل ببعض. */
              private suspend fun fillGaps(): Int {
                  if (rangeGaps().isEmpty()) return 0
                  setStatus("بجمّع الرسايل اللي في النص… (متحركش)", true)
                  var anchor = -1
                  val ls0 = lastSnap
                  if (ls0 != null) {
                      val v0 = visibleMsgs(ls0)
                      if (v0.isNotEmpty()) anchor = v0[v0.size / 2].id
                  }
                  var same = 0
                  var lastFirst = Int.MIN_VALUE
                  var iter = 0
                  while (currentCoroutineContext().isActive && iter < 800) {
                      iter++
                      if (rangeGaps().isEmpty()) break
                      val snap = readWindow() ?: break
                      mergeEntries(snap.entries)
                      val gaps = rangeGaps()
                      if (gaps.isEmpty()) break
                      val vis = visibleMsgs(snap)
                      if (vis.isEmpty()) break
                      val firstIdx = idxOf(vis[0].id)
                      val lastIdx = idxOf(vis[vis.size - 1].id)
                      var bestJ = gaps[0]
                      var bestDist = Int.MAX_VALUE
                      for (j in gaps) {
                          val dist = if (j < firstIdx) firstIdx - j else if (j >= lastIdx) j - lastIdx else 0
                          if (dist < bestDist) {
                              bestDist = dist
                              bestJ = j
                          }
                      }
                      val older = bestJ < (firstIdx + lastIdx) / 2
                      if (firstIdx == lastFirst) {
                          same++
                          if (same >= 4) break
                      } else {
                          same = 0
                      }
                      lastFirst = firstIdx
                      dirHint = if (older) -1 else 1
                      swipe(snap.listRect, limitBottomOf(snap.listRect), older)
                      delay(380)
                  }
                  if (anchor >= 0 && idxOf(anchor) >= 0) bringIntoView(anchor, 150)
                  setStatus("")
                  return rangeGaps().size
              }
          
              /** قبل النسخ: يفتح الرسائل الطويلة المقصوصة (ويسكرول لها لو مش ظاهرة) ويرجع مكانك. */
              private suspend fun ensureFull(): Int {
                  val ids = HashSet<Int>(truncIds())
                  if (ids.isEmpty()) return 0
                  setStatus("بجهّز ${ids.size} رسالة طويلة… (متحركش)", true)
                  expandVisible(ids)
                  val missing = truncIds()
                  if (missing.isNotEmpty()) {
                      var anchor = -1
                      val ls = lastSnap
                      if (ls != null) {
                          val vis = visibleMsgs(ls)
                          if (vis.isNotEmpty()) anchor = vis[vis.size / 2].id
                      }
                      val sorted = missing.sortedByDescending { idxOf(it) }
                      for (id in sorted) {
                          val i = idxOf(id)
                          if (i < 0 || !chat[i].trunc) continue
                          if (bringIntoView(id, 80)) {
                              val one = HashSet<Int>()
                              one.add(id)
                              expandVisible(one)
                          }
                      }
                      if (anchor >= 0) bringIntoView(anchor, 80)
                  }
                  setStatus("")
                  return truncIds().size
              }
          
              // ---------------------------------------------------------------- النسخ / التنزيل
          
              private fun onCopy() {
                  if (busy || selSet().isEmpty()) return
                  job = scope.launch { doCopy() }
              }
          
              private fun onDownload() {
                  if (busy || selSet().isEmpty()) return
                  job = scope.launch { doDownload() }
              }
          
              private fun beginBusy() {
                  busy = true
                  armed = 0
                  hideOverlay()
                  applyUi()
              }
          
              private fun endBusy() {
                  busy = false
                  job = null
                  applyUi()
                  if (on) refreshNow()
              }
          
              private suspend fun doCopy() {
                  beginBusy()
                  try {
                      val remaining = fillGaps()
                      val partial = ensureFull()
                      val out = buildOutput()
                      if (out.count == 0) {
                          toast("مفيش نص يتنسخ في الرسائل المحددة", true)
                          return
                      }
                      if (!writeClipboard(out.text)) {
                          toast("فشل النسخ، جرّب تنزيل كملف txt", true)
                          return
                      }
                      var base = "✓ تم نسخ ${out.count} رسالة"
                      if (out.skipped > 0) base += " (تخطي ${out.skipped} بدون نص)"
                      if (partial > 0) base += " — تنبيه: $partial رسالة طويلة اتنسخت ناقصة"
                      if (remaining > 0) base += " — في $remaining فجوة مقدرتش أملاها"
                      toast(base, partial > 0 || remaining > 0)
                      val emoji = Prefs.str(this, "reactEmoji", "")
                      if (emoji.isNotEmpty()) {
                          val res = reactAll(emoji)
                          toast("$base — $res", true)
                      }
                      if (Prefs.bool(this, "autoClear")) {
                          selected.clear()
                          ranges.clear()
                          excluded.clear()
                          lastPicked = -1
                      }
                  } finally {
                      endBusy()
                  }
              }
          
              private suspend fun doDownload() {
                  beginBusy()
                  try {
                      val remaining = fillGaps()
                      val partial = ensureFull()
                      val out = buildOutput()
                      if (out.count == 0) {
                          toast("مفيش نص يتنزل", true)
                          return
                      }
                      if (saveTxt(out.text)) {
                          val where = if (Build.VERSION.SDK_INT >= 29) " (في مجلد Download)" else ""
                          var msg = "✓ تم تنزيل ${out.count} رسالة$where"
                          if (partial > 0) msg += " — $partial طويلة ناقصة"
                          if (remaining > 0) msg += " — في $remaining فجوة مقدرتش أملاها"
                          toast(msg, partial > 0 || remaining > 0)
                      } else {
                          toast("فشل التنزيل", true)
                      }
                  } finally {
                      endBusy()
                  }
              }
          
              private fun onStop() {
                  job?.cancel()
                  job = null
                  busy = false
                  setStatus("اتوقف")
                  applyUi()
                  if (on) refreshNow()
              }
          
              // ---------------------------------------------------------------- التفاعل بعد النسخ
          
              private suspend fun reactAll(emoji: String): String {
                  val sel = selSet()
                  val ids = ArrayList<Int>()
                  for (m in chat) {
                      if (sel.contains(m.id)) ids.add(m.id)
                  }
                  val total = ids.size
                  val idSet = HashSet<Int>(ids)
                  val done = HashSet<Int>()
                  var had = 0
                  for (id in ids) {
                      if (reacted.contains("$id|$emoji")) {
                          done.add(id)
                          had++
                      }
                  }
                  var count = 0
                  var iter = 0
                  var stuck = 0
                  var sameSwipe = 0
                  var lastFirst = Int.MIN_VALUE
                  var failed = false
          
                  while (currentCoroutineContext().isActive && done.size < total && iter < 3000) {
                      iter++
                      val snap = readWindow()
                      if (snap == null) {
                          stuck++
                          if (stuck > 10) break
                          delay(600)
                          continue
                      }
                      mergeEntries(snap.entries)
                      stuck = 0
                      val list = snap.listRect
                      val limitBottom = limitBottomOf(list)
          
                      var acted = false
                      for (en in snap.entries) {
                          val m = en.msg ?: continue
                          if (!idSet.contains(m.id) || done.contains(m.id)) continue
                          val r = Rect()
                          en.body.getBoundsInScreen(r)
                          if (r.top < list.top + 6 || r.bottom > limitBottom) continue
                          val ok = reactTo(en.body, emoji)
                          if (!ok) {
                              failed = true
                              break
                          }
                          done.add(m.id)
                          reacted.add("${m.id}|$emoji")
                          count++
                          setStatus("تفاعل $count / ${total - had}", true)
                          delay(1100L + (0..500).random())
                          acted = true
                          break
                      }
                      if (failed) break
                      if (acted) continue
          
                      val vis = visibleMsgs(snap)
                      if (vis.isEmpty()) break
                      val firstIdx = idxOf(vis[0].id)
                      val lastIdx = idxOf(vis[vis.size - 1].id)
                      var above = false
                      var below = false
                      val inWin = ArrayList<Int>()
                      for (id in ids) {
                          if (done.contains(id)) continue
                          val i = idxOf(id)
                          if (i < 0) continue
                          if (i < firstIdx) above = true
                          else if (i > lastIdx) below = true
                          else inWin.add(i)
                      }
                      val older = when {
                          above -> true
                          below -> false
                          inWin.isNotEmpty() -> inWin[0] <= (firstIdx + lastIdx) / 2
                          else -> break
                      }
                      if (firstIdx == lastFirst) {
                          sameSwipe++
                          if (sameSwipe >= 3) break
                      } else {
                          sameSwipe = 0
                      }
                      lastFirst = firstIdx
                      dirHint = if (older) -1 else 1
                      swipe(list, limitBottom, older)
                      delay(700)
                  }
                  val res = "تفاعل $emoji: $count" +
                      (if (had > 0) " ($had كانت متفاعل عليها)" else "") +
                      (if (failed) " — مقدرتش أكمل (افتح ⚙ ودوس \"تقرير التفاعل\" وابعتهولي)" else "")
                  setStatus(res)
                  return res
              }
          
              private suspend fun reactTo(node: AccessibilityNodeInfo, emoji: String): Boolean {
                  var longClicked = false
                  var a: AccessibilityNodeInfo? = node
                  var up = 0
                  while (a != null && up < 8) {
                      if (a.isLongClickable) {
                          longClicked = a.performAction(AccessibilityNodeInfo.ACTION_LONG_CLICK)
                          break
                      }
                      a = a.parent
                      up++
                  }
                  val nr = Rect()
                  node.getBoundsInScreen(nr)
                  if (!longClicked) {
                      val p = Path()
                      p.moveTo(nr.left + nr.width() / 4f, nr.centerY().toFloat())
                      p.lineTo(nr.left + nr.width() / 4f + 1f, nr.centerY().toFloat() + 1f)
                      gesture(p, 800)
                  }
                  var target: AccessibilityNodeInfo? = null
                  for (attempt in 0 until 6) {
                      delay(if (attempt == 0) 800L else 350L)
                      target = findEmoji(nr, emoji)
                      if (target != null) break
                  }
                  if (target == null) {
                      lastDump = dumpWindows()
                      performGlobalAction(GLOBAL_ACTION_BACK)
                      delay(400)
                      return false
                  }
                  clickNode(target)
                  delay(300)
                  return true
              }
          
              private fun norm(s: CharSequence?): String {
                  return s?.toString()?.replace("\uFE0F", "")?.trim() ?: ""
              }
          
              private fun labelOf(n: AccessibilityNodeInfo): String {
                  val t = norm(n.text)
                  val d = norm(n.contentDescription)
                  return (t + " " + d).trim()
              }
          
              private fun emojiOf(label: String): String? {
                  if (label.isEmpty() || label.length > 40) return null
                  for (e in Prefs.EMOJIS) {
                      if (label.contains(e)) return e
                  }
                  return null
              }
          
              /** كل نوافذ الشاشة (شريط التفاعل ممكن يبقى في نافذة منبثقة) ماعدا نوافذ التطبيق نفسه. */
              private fun allRoots(): List<AccessibilityNodeInfo> {
                  val out = ArrayList<AccessibilityNodeInfo>()
                  try {
                      for (w in windows) {
                          val r = w.root ?: continue
                          if (r.packageName?.toString() == packageName) continue
                          out.add(r)
                      }
                  } catch (e: Exception) {
                  }
                  if (out.isEmpty()) {
                      val r = rootInActiveWindow
                      if (r != null) out.add(r)
                  }
                  return out
              }
          
              /** يدور على شريط التفاعلات اللي ظهر فوق الرسالة ويرجّع زر الإيموجي المطلوب. */
              private fun findEmoji(msg: Rect, emoji: String): AccessibilityNodeInfo? {
                  val roots = allRoots()
                  if (roots.isEmpty()) return null
                  val want = norm(emoji)
                  val groups = HashMap<AccessibilityNodeInfo, MutableList<AccessibilityNodeInfo>>()
                  val loose = ArrayList<AccessibilityNodeInfo>()
          
                  fun walk(n: AccessibilityNodeInfo, depth: Int) {
                      if (depth > 40) return
                      val id = n.viewIdResourceName ?: ""
                      if (!id.endsWith(":id/message_text") && !id.endsWith(":id/caption")) {
                          val label = labelOf(n)
                          if (emojiOf(label) != null) {
                              loose.add(n)
                              val p = n.parent
                              if (p != null) {
                                  var g = groups[p]
                                  if (g == null) {
                                      g = ArrayList<AccessibilityNodeInfo>()
                                      groups[p] = g
                                  }
                                  g.add(n)
                              }
                          }
                      }
                      for (i in 0 until n.childCount) {
                          val c = n.getChild(i) ?: continue
                          walk(c, depth + 1)
                      }
                  }
                  for (r in roots) walk(r, 0)
          
                  var bestGroup: MutableList<AccessibilityNodeInfo>? = null
                  for (g in groups.values) {
                      if (g.size >= 3 && (bestGroup == null || g.size > bestGroup.size)) bestGroup = g
                  }
                  if (bestGroup != null) {
                      for (n in bestGroup) {
                          if (emojiOf(labelOf(n)) == want) return n
                      }
                  }
                  // لو الإيموجي مش مكتوب كنص، بنختار حسب ترتيبه في الشريط
                  val idx = Prefs.EMOJIS.indexOf(want)
                  if (idx >= 0) {
                      val byIdx = findTrayByIndex(roots, msg, idx)
                      if (byIdx != null) return byIdx
                  }
                  for (n in loose) {
                      if (emojiOf(labelOf(n)) == want && groups[n.parent]?.size ?: 0 >= 2) return n
                  }
                  return null
              }
          
              /** شريط من 6-8 أزرار صغيرة في صف واحد: ناخد الأقرب للرسالة ونختار الزر برقمه. */
              private fun findTrayByIndex(roots: List<AccessibilityNodeInfo>, msg: Rect, idx: Int): AccessibilityNodeInfo? {
                  var best: AccessibilityNodeInfo? = null
                  var bestDist = Int.MAX_VALUE
                  val minW = dp(18)
                  val maxW = dp(100)
          
                  fun walk(n: AccessibilityNodeInfo, depth: Int) {
                      if (depth > 30) return
                      val cc = n.childCount
                      if (cc in 6..8) {
                          var clickable = 0
                          var okSize = true
                          var minTop = Int.MAX_VALUE
                          var maxTop = Int.MIN_VALUE
                          for (i in 0 until cc) {
                              val c = n.getChild(i)
                              if (c == null) {
                                  okSize = false
                                  break
                              }
                              val r = Rect()
                              c.getBoundsInScreen(r)
                              if (c.isClickable) clickable++
                              if (r.width() < minW || r.width() > maxW) okSize = false
                              if (r.top < minTop) minTop = r.top
                              if (r.top > maxTop) maxTop = r.top
                          }
                          if (okSize && clickable >= 6 && maxTop - minTop <= dp(10)) {
                              val pr = Rect()
                              n.getBoundsInScreen(pr)
                              val dist = Math.abs(pr.centerY() - msg.centerY())
                              if (dist < bestDist) {
                                  bestDist = dist
                                  best = n
                              }
                          }
                      }
                      for (i in 0 until cc) {
                          val c = n.getChild(i) ?: continue
                          walk(c, depth + 1)
                      }
                  }
                  for (r in roots) walk(r, 0)
                  val b = best ?: return null
                  if (idx >= b.childCount) return null
                  return b.getChild(idx)
              }
          
              private suspend fun clickNode(n: AccessibilityNodeInfo) {
                  var a: AccessibilityNodeInfo? = n
                  var up = 0
                  while (a != null && up < 6) {
                      if (a.isClickable && a.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return
                      a = a.parent
                      up++
                  }
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  val p = Path()
                  p.moveTo(r.centerX().toFloat(), r.centerY().toFloat())
                  gesture(p, 60)
              }
          
              private suspend fun swipe(list: Rect, bottom: Int, older: Boolean) {
                  val top = list.top
                  val h = (bottom - top).toFloat()
                  val x = list.left + list.width() * 0.5f
                  val y1 = if (older) top + h * 0.3f else top + h * 0.7f
                  val y2 = if (older) top + h * 0.7f else top + h * 0.3f
                  val p = Path()
                  p.moveTo(x, y1)
                  p.lineTo(x, y2)
                  gesture(p, 500)
              }
          
              private suspend fun gesture(path: Path, duration: Long): Boolean =
                  suspendCancellableCoroutine { cont ->
                      val g = GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(path, 0, duration))
                          .build()
                      val ok = dispatchGesture(g, object : AccessibilityService.GestureResultCallback() {
                          override fun onCompleted(gestureDescription: GestureDescription?) {
                              if (cont.isActive) cont.resume(true)
                          }
          
                          override fun onCancelled(gestureDescription: GestureDescription?) {
                              if (cont.isActive) cont.resume(false)
                          }
                      }, null)
                      if (!ok && cont.isActive) cont.resume(false)
                  }
          
              // ---------------------------------------------------------------- تشخيص
          
              private fun dump(n: AccessibilityNodeInfo, depth: Int, sb: StringBuilder, cap: Int) {
                  if (sb.length > cap || depth > 9) return
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  var cd = n.contentDescription?.toString() ?: ""
                  cd = if (cd.length > 24) "<long>" else cd.replace("\n", " ")
                  sb.append("  ".repeat(depth))
                  sb.append(n.className?.toString()?.substringAfterLast('.') ?: "?")
                  sb.append(" id=").append((n.viewIdResourceName ?: "").substringAfter(":id/"))
                  sb.append(" tl=").append(n.text?.length ?: 0)
                  sb.append(" cd=").append(cd)
                  sb.append(" [").append(r.left).append(",").append(r.top).append(",").append(r.right).append(",").append(r.bottom).append("]")
                  if (n.isClickable) sb.append(" C")
                  if (n.isLongClickable) sb.append(" L")
                  sb.append("\n")
                  for (i in 0 until n.childCount) {
                      val c = n.getChild(i) ?: continue
                      dump(c, depth + 1, sb, cap)
                  }
              }
          
              /** تقرير كل النوافذ (من غير نص الرسائل) — بيتحفظ جوه التطبيق عشان ما يمسحش اللي نسخته. */
              private fun dumpWindows(): String {
                  val out = StringBuilder()
                  out.append("== Geno reaction diag v2 == sdk=").append(Build.VERSION.SDK_INT).append("\n")
                  val roots = allRoots()
                  out.append("windows=").append(roots.size).append("\n")
                  for (r in roots) {
                      val sb = StringBuilder()
                      out.append("-- window pkg=").append(r.packageName).append(" children=").append(r.childCount).append("\n")
                      dump(r, 0, sb, 3800)
                      out.append(sb)
                  }
                  return out.toString()
              }
          
              private fun onReactDiag() {
                  val t = if (lastDump.isEmpty()) "لسه ماحصلش تفاعل فاشل" else lastDump
                  val ok = writeClipboard(t.take(14000))
                  toast(if (ok) "✓ اتنسخ تقرير التفاعل — الصقه في الشات معايا" else "فشل نسخ التقرير", true)
              }
          
              /** بينسخ تقرير عن شكل الرسائل في واتساب (من غير نص الرسائل) عشان نظبط التطبيق عليه. */
              private fun onDiag() {
                  val sb = StringBuilder()
                  sb.append("== Geno app diag v2 ==\n")
                  sb.append("sdk=").append(Build.VERSION.SDK_INT).append(" model=").append(Build.MODEL).append("\n")
                  val snap = readWindow()
                  if (snap == null) {
                      sb.append("مفيش شات مفتوح أو مش لاقي القايمة\n")
                  } else {
                      sb.append("titleLen=").append(snap.title.length).append(" group=").append(snap.group)
                      sb.append(" rows=").append(snap.list.childCount).append(" entries=").append(snap.entries.size).append("\n")
                      var shownRows = 0
                      for (i in 0 until snap.list.childCount) {
                          if (shownRows >= 3) break
                          val row = snap.list.getChild(i) ?: continue
                          val rs = RowScan()
                          scanRow(row, rs, 0)
                          sb.append("-- row ").append(i).append(" body=").append(rs.body != null)
                          sb.append(" mine=").append(rs.mine).append(" time=").append(rs.time.isNotEmpty())
                          sb.append(" sender=").append(rs.sender.isNotEmpty()).append(" quoted=").append(rs.quoted.isNotEmpty())
                          sb.append(" divider=").append(rs.divider.isNotEmpty()).append("\n")
                          dump(row, 1, sb, 8500)
                          shownRows++
                      }
                  }
                  val ok = writeClipboard(sb.toString().take(9000))
                  toast(if (ok) "✓ اتنسخ تقرير التشخيص — الصقه في الشات معايا" else "فشل نسخ التقرير", true)
              }
          
              // ---------------------------------------------------------------- واجهة (مربعات التحديد)
          
              private fun overlayParams(x: Int, y: Int, w: Int, h: Int, touchable: Boolean): WindowManager.LayoutParams {
                  var f = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  if (!touchable) f = f or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  val p = WindowManager.LayoutParams(
                      w, h,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      f,
                      PixelFormat.TRANSLUCENT
                  )
                  p.gravity = Gravity.TOP or Gravity.LEFT
                  p.x = x
                  p.y = y
                  return p
              }
          
              private fun updateOverlay(snap: Snap) {
                  if (busy || !on) {
                      hideOverlay()
                      return
                  }
                  val items = ArrayList<Pair<Rect, Int>>()
                  for (e in snap.entries) {
                      val m = e.msg ?: continue
                      items.add(Pair(e.row, m.id))
                  }
                  val lr = snap.listRect
                  val sw = dp(40)
                  val right = Prefs.str(this, "side", "right") == "right"
                  val sx = if (right) lr.right - sw else lr.left
                  val hx = lr.left
                  val hy = lr.top
                  val hw = lr.width()
                  val hh = lr.height()
                  if (hw <= 0 || hh <= 0) return
                  if (!overlayShown) {
                      hiLp = overlayParams(hx, hy, hw, hh, false)
                      stripLp = overlayParams(sx, hy, sw, hh, true)
                      try {
                          wm.addView(hiView, hiLp)
                          wm.addView(stripView, stripLp)
                          overlayShown = true
                      } catch (e: Exception) {
                          try {
                              wm.removeView(hiView)
                          } catch (e2: Exception) {
                          }
                          return
                      }
                      if (shown) {
                          try {
                              wm.removeView(panel)
                              wm.addView(panel, lp)
                          } catch (e: Exception) {
                          }
                      }
                  } else {
                      if (hiLp.x != hx || hiLp.y != hy || hiLp.width != hw || hiLp.height != hh) {
                          hiLp.x = hx
                          hiLp.y = hy
                          hiLp.width = hw
                          hiLp.height = hh
                          try {
                              wm.updateViewLayout(hiView, hiLp)
                          } catch (e: Exception) {
                          }
                      }
                      if (stripLp.x != sx || stripLp.y != hy || stripLp.width != sw || stripLp.height != hh) {
                          stripLp.x = sx
                          stripLp.y = hy
                          stripLp.width = sw
                          stripLp.height = hh
                          try {
                              wm.updateViewLayout(stripView, stripLp)
                          } catch (e: Exception) {
                          }
                      }
                  }
                  val ss = selSet()
                  hiView.items = items
                  hiView.selectedIds = ss
                  hiView.listTop = lr.top
                  hiView.listBottom = lr.bottom
                  hiView.invalidate()
                  stripView.items = items
                  stripView.selectedIds = ss
                  stripView.anchorId = rangeStartId
                  stripView.listTop = lr.top
                  stripView.listBottom = lr.bottom
                  stripView.invalidate()
              }
          
              private fun hideOverlay() {
                  if (!overlayShown) return
                  try {
                      wm.removeView(stripView)
                  } catch (e: Exception) {
                  }
                  try {
                      wm.removeView(hiView)
                  } catch (e: Exception) {
                  }
                  overlayShown = false
              }
          
              // ---------------------------------------------------------------- اللوحة العايمة
          
              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
          
              private fun setStatus(t: String, sticky: Boolean = false) {
                  if (!::status.isInitialized) return
                  handler.removeCallbacks(clearStatusRun)
                  status.text = t
                  status.visibility = if (t.isEmpty()) View.GONE else View.VISIBLE
                  if (t.isNotEmpty() && !sticky) handler.postDelayed(clearStatusRun, 5000)
              }
          
              private fun tint(b: Button, color: String) {
                  val g = GradientDrawable()
                  g.setColor(Color.parseColor(color))
                  g.cornerRadius = dp(8).toFloat()
                  b.background = g
              }
          
              private fun mkBtn(label: String, bgColor: String, onClick: () -> Unit): Button {
                  val b = Button(this)
                  b.text = label
                  b.textSize = 12f
                  b.isAllCaps = false
                  b.minHeight = 0
                  b.minimumHeight = 0
                  b.minWidth = 0
                  b.minimumWidth = 0
                  b.setPadding(dp(8), dp(7), dp(8), dp(7))
                  b.setTextColor(Color.WHITE)
                  tint(b, bgColor)
                  b.setOnClickListener { onClick() }
                  return b
              }
          
              private fun addBar(v: View) {
                  val p = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )
                  p.setMargins(dp(2), 0, dp(2), 0)
                  bar.addView(v, p)
              }
          
              private fun buildPanel() {
                  val dm = resources.displayMetrics
                  panel = LinearLayout(this)
                  panel.orientation = LinearLayout.VERTICAL
                  val bg = GradientDrawable()
                  bg.setColor(Color.parseColor("#F2111B21"))
                  bg.cornerRadius = dp(14).toFloat()
                  panel.background = bg
                  panel.setPadding(dp(6), dp(5), dp(6), dp(5))
                  panel.layoutDirection = View.LAYOUT_DIRECTION_RTL
          
                  pop = ScrollView(this)
                  popBox = LinearLayout(this)
                  popBox.orientation = LinearLayout.VERTICAL
                  popBox.setPadding(dp(4), 0, dp(4), dp(6))
                  pop.addView(popBox)
                  pop.visibility = View.GONE
                  val popH = minOf((dm.heightPixels * 0.5f).toInt(), dp(380))
                  panel.addView(pop, LinearLayout.LayoutParams(dp(260), popH))
          
                  status = TextView(this)
                  status.setTextColor(Color.WHITE)
                  status.textSize = 12f
                  status.setPadding(dp(4), dp(2), dp(4), dp(4))
                  status.visibility = View.GONE
                  panel.addView(status, LinearLayout.LayoutParams(dp(260), LinearLayout.LayoutParams.WRAP_CONTENT))
          
                  bar = LinearLayout(this)
                  bar.orientation = LinearLayout.HORIZONTAL
                  bar.gravity = Gravity.CENTER_VERTICAL
          
                  grip = TextView(this)
                  grip.text = "⋮⋮"
                  grip.textSize = 14f
                  grip.setTextColor(Color.parseColor("#8696A0"))
                  grip.setPadding(dp(8), dp(6), dp(8), dp(6))
                  bar.addView(grip)
          
                  logo = ImageView(this)
                  logo.setImageResource(R.drawable.ic_launcher)
                  logo.setOnClickListener { setOn(!on) }
                  logo.setOnLongClickListener {
                      togglePop()
                      true
                  }
                  bar.addView(logo, LinearLayout.LayoutParams(dp(32), dp(32)))
          
                  toggle = mkBtn("تحديد رسائل", "#2A3942") { setOn(!on) }
                  addBar(toggle)
          
                  startB = mkBtn("بداية", "#2A3942") { onStartBtn() }
                  addBar(startB)
          
                  endB = mkBtn("نهاية", "#2A3942") { onEndBtn() }
                  addBar(endB)
          
                  count = TextView(this)
                  count.setTextColor(Color.parseColor("#E9EDEF"))
                  count.textSize = 12f
                  count.setPadding(dp(4), 0, dp(4), 0)
                  addBar(count)
          
                  copyB = mkBtn("نسخ", "#00A884") { onCopy() }
                  addBar(copyB)
          
                  gearB = mkBtn("⚙", "#2A3942") { togglePop() }
                  addBar(gearB)
          
                  stopB = mkBtn("إيقاف", "#D93025") { onStop() }
                  addBar(stopB)
          
                  panel.addView(bar)
          
                  lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.BOTTOM or Gravity.LEFT
                  lp.x = Prefs.int(this, "px", (dm.widthPixels * 0.04f).toInt())
                  lp.y = Prefs.int(this, "py", dp(110))
          
                  grip.setOnTouchListener(object : View.OnTouchListener {
                      var sx = 0f
                      var sy = 0f
                      var ox = 0
                      var oy = 0
          
                      override fun onTouch(v: View, ev: MotionEvent): Boolean {
                          when (ev.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  sx = ev.rawX
                                  sy = ev.rawY
                                  ox = lp.x
                                  oy = lp.y
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val m = resources.displayMetrics
                                  lp.x = minOf(maxOf(0, ox + (ev.rawX - sx).toInt()), m.widthPixels - dp(60))
                                  lp.y = minOf(maxOf(0, oy - (ev.rawY - sy).toInt()), m.heightPixels - dp(60))
                                  if (shown) wm.updateViewLayout(panel, lp)
                              }
                              MotionEvent.ACTION_UP -> {
                                  Prefs.setInt(this@WaService, "px", lp.x)
                                  Prefs.setInt(this@WaService, "py", lp.y)
                              }
                          }
                          return true
                      }
                  })
              }
          
              private fun applyUi() {
                  if (!::panel.isInitialized) return
                  val collapsed = Prefs.bool(this, "integrate") && !on && !busy
                  val n = selSet().size
                  toggle.visibility = if (collapsed || busy) View.GONE else View.VISIBLE
                  toggle.text = if (on) "✕" else "تحديد رسائل"
                  startB.visibility = if (on && !busy) View.VISIBLE else View.GONE
                  endB.visibility = if (on && !busy) View.VISIBLE else View.GONE
                  tint(startB, if (armed == 1) "#FFB300" else "#2A3942")
                  tint(endB, if (armed == 2) "#FFB300" else "#2A3942")
                  count.visibility = if (on && !busy) View.VISIBLE else View.GONE
                  count.text = "$n ✓"
                  copyB.visibility = if (on && !busy) View.VISIBLE else View.GONE
                  copyB.isEnabled = n > 0
                  copyB.alpha = if (n == 0) 0.4f else 1f
                  gearB.visibility = if (collapsed || busy) View.GONE else View.VISIBLE
                  stopB.visibility = if (busy) View.VISIBLE else View.GONE
                  if (busy && popOpen) {
                      popOpen = false
                      pop.visibility = View.GONE
                  }
              }
          
              private fun togglePop() {
                  popOpen = !popOpen
                  if (popOpen) {
                      buildPop()
                      pop.visibility = View.VISIBLE
                  } else {
                      pop.visibility = View.GONE
                  }
              }
          
              private fun popRow(): LinearLayout {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  return row
              }
          
              private fun addTo(row: LinearLayout, b: View) {
                  val p = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  p.setMargins(dp(2), 0, dp(2), 0)
                  row.addView(b, p)
              }
          
              private fun buildPop() {
                  popBox.removeAllViews()
                  if (on) {
                      popBox.addView(SettingsUi.section(this, "تحديد سريع"))
                      val q = popRow()
                      addTo(q, mkBtn("كل الرسائل", "#2A3942") { selectWhere { true } })
                      addTo(q, mkBtn("رسائلي", "#2A3942") { selectWhere { it.mine } })
                      addTo(q, mkBtn("رسائلهم", "#2A3942") { selectWhere { !it.mine } })
                      popBox.addView(q)
                  }
                  popBox.addView(
                      SettingsUi.build(this, false) {
                          applyUi()
                          val s = lastSnap
                          if (s != null) updateOverlay(s)
                      }
                  )
                  popBox.addView(SettingsUi.section(this, "أدوات"))
                  val a = popRow()
                  addTo(a, mkBtn("تنزيل txt", "#2A3942") { onDownload() })
                  addTo(a, mkBtn("مسح التحديد", "#2A3942") { clearSelection() })
                  popBox.addView(a)
                  val b = popRow()
                  addTo(b, mkBtn("تشخيص (ينسخ تقرير)", "#2A3942") { onDiag() })
                  addTo(b, mkBtn("إعدادات كاملة", "#2A3942") { openApp() })
                  popBox.addView(b)
                  val c = popRow()
                  addTo(c, mkBtn("تقرير التفاعل", "#2A3942") { onReactDiag() })
                  popBox.addView(c)
              }
          
              private fun openApp() {
                  val i = Intent(this, MainActivity::class.java)
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  startActivity(i)
              }
          
              private fun showPanel() {
                  if (shown) return
                  try {
                      wm.addView(panel, lp)
                      shown = true
                  } catch (e: Exception) {
                  }
              }
          
              private fun hidePanel() {
                  if (!shown) return
                  try {
                      wm.removeView(panel)
                  } catch (e: Exception) {
                  }
                  shown = false
              }
          }
          EOF

      - name: Install fixed signing key
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Geno - نسخة ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
