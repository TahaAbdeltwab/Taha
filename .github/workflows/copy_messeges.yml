          package com.example.chatcopier

          import android.content.Context
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.Switch
          import android.widget.TextView

          object SettingsUi {
              private const val TX = "#E9EDEF"
              private const val MUT = "#8696A0"
              private const val AC = "#00A884"
              private const val BG3 = "#2A3942"

              private fun dp(c: Context, v: Int): Int {
                  return (v * c.resources.displayMetrics.density).toInt()
              }

              private fun round(c: Context, color: String, r: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(Color.parseColor(color))
                  g.cornerRadius = dp(c, r).toFloat()
                  return g
              }

              fun section(c: Context, t: String): TextView {
                  val v = TextView(c)
                  v.text = t
                  v.textSize = 11f
                  v.setTextColor(Color.parseColor(MUT))
                  v.setPadding(0, dp(c, 10), 0, dp(c, 3))
                  return v
              }

              private fun sw(c: Context, label: String, key: String, onChange: () -> Unit): Switch {
                  val s = Switch(c)
                  s.text = label
                  s.textSize = 12f
                  s.setTextColor(Color.parseColor(TX))
                  s.isChecked = Prefs.bool(c, key)
                  s.setPadding(0, dp(c, 4), 0, dp(c, 4))
                  s.setOnCheckedChangeListener { _, v ->
                      Prefs.setBool(c, key, v)
                      onChange()
                  }
                  return s
              }

              private fun chips(
                  c: Context,
                  key: String,
                  def: String,
                  labels: List<String>,
                  values: List<String>,
                  onPick: () -> Unit
              ): LinearLayout {
                  val row = LinearLayout(c)
                  row.orientation = LinearLayout.HORIZONTAL
                  val btns = ArrayList<Button>()

                  fun mark() {
                      val cur = Prefs.str(c, key, def)
                      for (i in btns.indices) {
                          btns[i].background = round(c, if (values[i] == cur) AC else BG3, 14)
                      }
                  }

                  for (i in labels.indices) {
                      val b = Button(c)
                      b.text = labels[i]
                      b.textSize = 11f
                      b.isAllCaps = false
                      b.minHeight = 0
                      b.minimumHeight = 0
                      b.minWidth = 0
                      b.minimumWidth = 0
                      b.setPadding(dp(c, 4), dp(c, 6), dp(c, 4), dp(c, 6))
                      b.setTextColor(Color.parseColor(TX))
                      b.setOnClickListener {
                          Prefs.setStr(c, key, values[i])
                          mark()
                          onPick()
                      }
                      val lp = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      lp.setMargins(dp(c, 2), 0, dp(c, 2), 0)
                      row.addView(b, lp)
                      btns.add(b)
                  }
                  mark()
                  return row
              }

              /** full = true يضيف خانة كتابة الفاصل المخصص (بتشتغل بس في شاشة التطبيق). */
              fun build(c: Context, full: Boolean, onChange: () -> Unit): LinearLayout {
                  val box = LinearLayout(c)
                  box.orientation = LinearLayout.VERTICAL
                  box.layoutDirection = View.LAYOUT_DIRECTION_RTL

                  box.addView(section(c, "خيارات النسخ"))
                  box.addView(sw(c, "اسم المرسل", "sender", onChange))
                  box.addView(sw(c, "الوقت والتاريخ", "time", onChange))
                  box.addView(sw(c, "ترقيم الرسائل", "number", onChange))
                  box.addView(sw(c, "الرسالة المقتبسة (الرد)", "quoted", onChange))
                  box.addView(sw(c, "مسح التحديد بعد النسخ", "autoClear", onChange))
                  box.addView(sw(c, "تحديد بالضغط على الرسالة (تجريبي)", "clickAnywhere", onChange))
                  box.addView(sw(c, "دمج Geno (زرار صغير بدل اللوحة)", "integrate", onChange))

                  box.addView(section(c, "مكان مربعات التحديد"))
                  box.addView(chips(c, "side", "right", listOf("يمين", "يسار"), listOf("right", "left"), onChange))

                  box.addView(section(c, "تفاعل بعد النسخ (الطرف التاني بيشوفه)"))
                  val emLabels = ArrayList<String>()
                  val emValues = ArrayList<String>()
                  emLabels.add("بدون")
                  emValues.add("")
                  for (e in Prefs.EMOJIS) {
                      emLabels.add(e)
                      emValues.add(e)
                  }
                  box.addView(chips(c, "reactEmoji", "", emLabels, emValues, onChange))

                  box.addView(section(c, "الفاصل بين الرسائل (\\n = سطر جديد)"))

                  var et: EditText? = null
                  if (full) {
                      val e = EditText(c)
                      e.setText(Prefs.str(c, "sep", Prefs.SEP_LINE))
                      e.setTextColor(Color.parseColor(TX))
                      e.textSize = 13f
                      e.setSingleLine(true)
                      e.layoutDirection = View.LAYOUT_DIRECTION_LTR
                      e.addTextChangedListener(object : TextWatcher {
                          override fun afterTextChanged(s: Editable?) {
                              Prefs.setStr(c, "sep", s?.toString() ?: "")
                          }

                          override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}

                          override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      })
                      et = e
                  }

                  box.addView(
                      chips(
                          c, "sep", Prefs.SEP_LINE,
                          listOf("خط فاصل", "نجوم", "سطر فاضي", "سطر"),
                          listOf(Prefs.SEP_LINE, Prefs.SEP_STARS, Prefs.SEP_BLANK, Prefs.SEP_NL)
                      ) {
                          et?.setText(Prefs.str(c, "sep", Prefs.SEP_LINE))
                          onChange()
                      }
                  )
                  val editor: EditText? = et
                  if (editor != null) box.addView(editor)
                  return box
              }
          }
          EOF
