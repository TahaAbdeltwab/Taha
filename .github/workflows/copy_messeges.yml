name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create project files
        run: |
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ChatCopier"
          include(":app")
          EOF
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          kotlin.code.style=official
          android.useAndroidX=false
          EOF
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.chatcopier"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.chatcopier"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".WaService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF
          mkdir -p "$(dirname 'app/src/main/res/xml/accessibility_service_config.xml')"
          cat > 'app/src/main/res/xml/accessibility_service_config.xml' <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewScrolled|typeViewClicked|typeViewLongClicked"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:notificationTimeout="100"
              android:description="@string/service_desc" />
          EOF
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">ناسخ الرسائل</string>
              <string name="service_desc">يعرض لوحة عائمة داخل واتساب لتحديد مجموعة رسائل ونسخ نصوصها فقط بدون التاريخ واسم المرسل.</string>
          </resources>
          EOF
          mkdir -p "$(dirname 'app/src/main/java/com/example/chatcopier/MainActivity.kt')"
          cat > 'app/src/main/java/com/example/chatcopier/MainActivity.kt' <<'EOF'
          package com.example.chatcopier

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (20 * resources.displayMetrics.density).toInt()

                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                  }

                  box.addView(TextView(this).apply {
                      textSize = 22f
                      text = "ناسخ الرسائل"
                  })

                  box.addView(TextView(this).apply {
                      textSize = 16f
                      setPadding(0, pad, 0, pad)
                      text = "1) دوس \"فتح إعدادات الإتاحة\" وفعّل خدمة \"ناسخ الرسائل\".\n" +
                          "   (لو الخيار رمادي: دوس \"إعدادات التطبيق\" ثم ⋮ ثم \"السماح بالإعدادات المقيّدة\"، وبعدها فعّل الخدمة.)\n\n" +
                          "2) افتح أي شات في واتساب، هتلاقي لوحة صغيرة عائمة تقدر تسحبها.\n\n" +
                          "3) اضغط ضغطة طويلة على أول رسالة، وبعدها دوس \"بداية\".\n\n" +
                          "4) اسكرول براحة لآخر رسالة، اضغط عليها ضغطة طويلة، ودوس \"نهاية\". هيظهر لك عدد الرسائل.\n\n" +
                          "5) دوس \"نسخ\". النص هيتنسخ بدون تاريخ أو اسم، وبينهم **************\n\n" +
                          "6) لو عايز تفاعل بإيموجي: فعّل \"تفاعل\" واختار الإيموجي قبل ما تدوس \"نسخ\"."
                  })

                  box.addView(Button(this).apply {
                      text = "فتح إعدادات الإتاحة"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })

                  box.addView(Button(this).apply {
                      text = "إعدادات التطبيق"
                      setOnClickListener {
                          startActivity(
                              Intent(
                                  Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                                  Uri.parse("package:$packageName")
                              )
                          )
                      }
                  })

                  setContentView(ScrollView(this).apply { addView(box) })
              }
          }
          EOF
          mkdir -p "$(dirname 'app/src/main/java/com/example/chatcopier/WaService.kt')"
          cat > 'app/src/main/java/com/example/chatcopier/WaService.kt' <<'EOF'
          package com.example.chatcopier

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.currentCoroutineContext
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.isActive
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlin.coroutines.resume

          class WaService : AccessibilityService() {

              companion object {
                  // الفاصل بين الرسايل (14 نجمة)
                  const val SEP = "**************"

                  // تفاعلات واتساب الافتراضية (بدون رمز التنسيق FE0F)
                  val EMOJIS = listOf("👍", "❤", "😂", "😮", "😢", "🙏")
              }

              private class Entry(val text: String, val node: AccessibilityNodeInfo)

              private lateinit var wm: WindowManager
              private lateinit var panel: LinearLayout
              private lateinit var lp: WindowManager.LayoutParams
              private lateinit var status: TextView
              private lateinit var row1: LinearLayout
              private lateinit var btnReact: Button
              private lateinit var btnEmoji: Button
              private lateinit var btnStop: Button

              private var shown = false
              private val handler = Handler(Looper.getMainLooper())
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main)
              private var job: Job? = null
              private var capturePending = false

              private val recorded = mutableListOf<String>()
              private var recording = false
              private var startMarker: String? = null
              private var lastTouched: String? = null
              private var selection: List<String> = emptyList()
              private var selLo = 0
              private var selHi = -1
              private var reactOn = false
              private var emojiIdx = 0
              private var imePkgs: Set<String>? = null

              // ---------------------------------------------------------------- lifecycle

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  buildPanel()
                  val r = rootInActiveWindow
                  if (isWa(r?.packageName?.toString())) showPanel()
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  job?.cancel()
                  scope.cancel()
                  hidePanel()
                  super.onDestroy()
              }

              private fun isWa(pkg: String?): Boolean = pkg != null && pkg.startsWith("com.whatsapp")

              private fun imePackages(): Set<String> {
                  imePkgs?.let { return it }
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                  val s = imm.enabledInputMethodList.map { it.packageName }.toSet()
                  imePkgs = s
                  return s
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null) return
                  val pkg = e.packageName?.toString()
                  when (e.eventType) {
                      AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED -> {
                          if (isWa(pkg)) {
                              showPanel()
                          } else if (pkg != null && pkg != packageName &&
                              pkg != "com.android.systemui" && pkg !in imePackages()
                          ) {
                              hidePanel()
                          }
                      }
                      AccessibilityEvent.TYPE_VIEW_CLICKED,
                      AccessibilityEvent.TYPE_VIEW_LONG_CLICKED -> {
                          if (isWa(pkg)) captureTouched(e.source)
                      }
                      AccessibilityEvent.TYPE_VIEW_SCROLLED,
                      AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED -> {
                          if (recording && isWa(pkg) && !capturePending) {
                              capturePending = true
                              handler.postDelayed({
                                  capturePending = false
                                  if (recording) capture()
                              }, 200)
                          }
                      }
                  }
              }

              // ---------------------------------------------------------------- reading messages

              /** يستخرج نصوص الرسايل الظاهرة (بدون اسم المرسل أو التاريخ/الوقت). */
              private fun extract(root: AccessibilityNodeInfo): List<Entry> {
                  val out = mutableListOf<Entry>()
                  fun walk(n: AccessibilityNodeInfo) {
                      val id = n.viewIdResourceName ?: ""
                      if ((id.endsWith(":id/message_text") || id.endsWith(":id/caption")) && n.isVisibleToUser) {
                          val t = n.text?.toString()?.trim()
                          if (!t.isNullOrEmpty()) out.add(Entry(t, n))
                      }
                      for (i in 0 until n.childCount) {
                          val c = n.getChild(i) ?: continue
                          walk(c)
                      }
                  }
                  walk(root)
                  return out
              }

              private fun captureTouched(src: AccessibilityNodeInfo?) {
                  var n = src
                  var depth = 0
                  while (n != null && depth < 8) {
                      val list = extract(n)
                      if (list.size == 1) {
                          lastTouched = list[0].text
                          return
                      }
                      if (list.size > 1) return
                      n = n.parent
                      depth++
                  }
              }

              /** يدمج الرسايل الظاهرة حالياً في القائمة المسجلة بحسب التداخل. */
              private fun capture(): Boolean {
                  val root = rootInActiveWindow ?: return false
                  if (!isWa(root.packageName?.toString())) return false
                  val w = extract(root).map { it.text }
                  if (w.isEmpty()) return true
                  if (recorded.isEmpty()) {
                      recorded.addAll(w)
                  } else {
                      val d = align(recorded, w)
                      if (d == null) {
                          setStatus("⚠ في فجوة، ارجع لورا شوية واسكرول أبطأ")
                          return false
                      }
                      val origSize = recorded.size
                      if (d + w.size > origSize) recorded.addAll(w.subList(origSize - d, w.size))
                      if (d < 0) recorded.addAll(0, w.subList(0, -d))
                  }
                  setStatus("بيسجّل… ${recorded.size} رسالة")
                  return true
              }

              /** يرجّع مكان أول عنصر من W داخل L لو في تداخل، وإلا null. */
              private fun align(l: List<String>, w: List<String>): Int? {
                  if (w.isEmpty() || l.isEmpty()) return null
                  val need = minOf(2, w.size, l.size)
                  var best = 0
                  var bestD: Int? = null
                  for (d in -(w.size - 1) until l.size) {
                      val from = maxOf(0, -d)
                      val to = minOf(w.size, l.size - d)
                      val cnt = to - from
                      if (cnt < need || cnt <= best) continue
                      var ok = true
                      for (t in from until to) {
                          if (l[d + t] != w[t]) {
                              ok = false
                              break
                          }
                      }
                      if (ok) {
                          best = cnt
                          bestD = d
                      }
                  }
                  return bestD
              }

              // ---------------------------------------------------------------- button actions

              private fun onStart() {
                  val m = lastTouched
                  if (m == null) {
                      setStatus("اضغط ضغطة طويلة على أول رسالة الأول")
                      return
                  }
                  job?.cancel()
                  recorded.clear()
                  selection = emptyList()
                  recording = true
                  startMarker = m
                  lastTouched = null
                  capture()
                  setStatus("بداية: ${preview(m)}\nاسكرول لآخر رسالة، اضغط عليها ضغطة طويلة، ثم \"نهاية\"")
              }

              private fun onEnd() {
                  if (!recording) {
                      setStatus("دوس \"بداية\" الأول")
                      return
                  }
                  val m = lastTouched
                  if (m == null) {
                      setStatus("اضغط ضغطة طويلة على آخر رسالة الأول")
                      return
                  }
                  capture()
                  val s = startMarker ?: return
                  var lo = recorded.indexOf(s)
                  var hi = recorded.lastIndexOf(m)
                  if (hi < lo) {
                      lo = recorded.indexOf(m)
                      hi = recorded.lastIndexOf(s)
                  }
                  if (lo < 0 || hi < lo) {
                      setStatus("مالقيتش الرسالتين في التسجيل. ارجع اسكرول تاني بشكل أبطأ وكرر \"نهاية\"")
                      return
                  }
                  selection = recorded.subList(lo, hi + 1).toList()
                  selLo = lo
                  selHi = hi
                  recording = false
                  lastTouched = null
                  setStatus("تم تحديد ${selection.size} رسالة ✔\nدوس \"نسخ\"")
              }

              private fun onCopy() {
                  if (selection.isEmpty()) {
                      setStatus("حدد الرسايل الأول (بداية ← نهاية)")
                      return
                  }
                  val text = selection.joinToString("\n$SEP\n")
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("messages", text))
                  setStatus("تم نسخ ${selection.size} رسالة ✔")
                  if (reactOn) {
                      setRunningUi(true)
                      job = scope.launch { reactLoop() }
                  }
              }

              private fun onStop() {
                  job?.cancel()
                  job = null
                  setRunningUi(false)
                  setStatus("اتوقف التفاعل")
              }

              // ---------------------------------------------------------------- reactions (optional)

              private suspend fun reactLoop() {
                  val emoji = EMOJIS[emojiIdx]
                  val done = BooleanArray(recorded.size)
                  val total = selHi - selLo + 1
                  var count = 0
                  var iter = 0
                  var stuck = 0
                  var sameSwipe = 0
                  var lastD = Int.MIN_VALUE

                  while (currentCoroutineContext().isActive && count < total && iter < 1500) {
                      iter++
                      val root = rootInActiveWindow
                      if (root == null || !isWa(root.packageName?.toString())) {
                          stuck++
                          if (stuck > 10) break
                          delay(600)
                          continue
                      }
                      val entries = extract(root)
                      val d = align(recorded, entries.map { it.text })
                      if (d == null) {
                          stuck++
                          if (stuck > 6) break
                          delay(500)
                          continue
                      }
                      stuck = 0
                      val list = findList(root) ?: break
                      val loc = IntArray(2)
                      panel.getLocationOnScreen(loc)
                      val limitBottom = (if (loc[1] > list.centerY()) minOf(list.bottom, loc[1]) else list.bottom) - 6

                      var acted = false
                      for ((t, en) in entries.withIndex()) {
                          val idx = d + t
                          if (idx < selLo || idx > selHi || done[idx]) continue
                          val r = Rect()
                          en.node.getBoundsInScreen(r)
                          if (r.top < list.top + 6 || r.bottom > limitBottom) continue
                          val ok = reactTo(en.node, emoji)
                          if (!ok) {
                              setStatus("وقفت: مقدرتش أتفاعل (تم $count من $total). لو التحديد لسه شغال في واتساب اضغط رجوع.")
                              finishRun()
                              return
                          }
                          done[idx] = true
                          count++
                          setStatus("تفاعل $count / $total")
                          delay(1100L + (0..500).random())
                          acted = true
                          break
                      }
                      if (acted) continue

                      val firstIdx = d
                      val lastIdx = d + entries.size - 1
                      val above = (selLo until firstIdx).any { !done[it] }
                      val below = ((lastIdx + 1)..selHi).any { !done[it] }
                      val inWin = (maxOf(firstIdx, selLo)..minOf(lastIdx, selHi)).filter { !done[it] }
                      val older = when {
                          above -> true
                          below -> false
                          inWin.isNotEmpty() -> inWin.first() <= (firstIdx + lastIdx) / 2
                          else -> break
                      }
                      if (d == lastD) {
                          sameSwipe++
                          if (sameSwipe >= 3) break
                      } else {
                          sameSwipe = 0
                      }
                      lastD = d
                      swipe(list, limitBottom, older)
                      delay(900)
                  }
                  setStatus("انتهى: تفاعلت على $count من $total")
                  finishRun()
              }

              private fun finishRun() {
                  job = null
                  setRunningUi(false)
              }

              private suspend fun reactTo(node: AccessibilityNodeInfo, emoji: String): Boolean {
                  var longClicked = false
                  var a: AccessibilityNodeInfo? = node
                  var up = 0
                  while (a != null && up < 8) {
                      if (a.isLongClickable) {
                          longClicked = a.performAction(AccessibilityNodeInfo.ACTION_LONG_CLICK)
                          break
                      }
                      a = a.parent
                      up++
                  }
                  if (!longClicked) {
                      val r = Rect()
                      node.getBoundsInScreen(r)
                      val p = Path().apply {
                          moveTo(r.left + r.width() / 4f, r.centerY().toFloat())
                          lineTo(r.left + r.width() / 4f + 1f, r.centerY().toFloat() + 1f)
                      }
                      gesture(p, 800)
                  }
                  delay(900)
                  val target = findEmoji(rootInActiveWindow, emoji) ?: return false
                  clickNode(target)
                  delay(300)
                  return true
              }

              private fun norm(s: CharSequence?): String = s?.toString()?.replace("️", "")?.trim() ?: ""

              /** يدور على شريط التفاعلات اللي ظهر فوق الرسالة ويرجّع زر الإيموجي المطلوب. */
              private fun findEmoji(root: AccessibilityNodeInfo?, emoji: String): AccessibilityNodeInfo? {
                  if (root == null) return null
                  val want = norm(emoji)
                  val groups = HashMap<AccessibilityNodeInfo, MutableList<AccessibilityNodeInfo>>()
                  val loose = mutableListOf<AccessibilityNodeInfo>()
                  fun walk(n: AccessibilityNodeInfo) {
                      val id = n.viewIdResourceName ?: ""
                      if (!id.endsWith(":id/message_text") && !id.endsWith(":id/caption")) {
                          val label = norm(n.text).ifEmpty { norm(n.contentDescription) }
                          if (label in EMOJIS) {
                              loose.add(n)
                              val p = n.parent
                              if (p != null) groups.getOrPut(p) { mutableListOf() }.add(n)
                          }
                      }
                      for (i in 0 until n.childCount) {
                          val c = n.getChild(i) ?: continue
                          walk(c)
                      }
                  }
                  walk(root)
                  fun labelOf(n: AccessibilityNodeInfo) = norm(n.text).ifEmpty { norm(n.contentDescription) }
                  val bestGroup = groups.values.filter { it.size >= 3 }.maxByOrNull { it.size }
                  if (bestGroup != null) {
                      bestGroup.firstOrNull { labelOf(it) == want }?.let { return it }
                  }
                  return loose.firstOrNull { labelOf(it) == want }
              }

              private suspend fun clickNode(n: AccessibilityNodeInfo) {
                  var a: AccessibilityNodeInfo? = n
                  var up = 0
                  while (a != null && up < 6) {
                      if (a.isClickable && a.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return
                      a = a.parent
                      up++
                  }
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  val p = Path().apply { moveTo(r.centerX().toFloat(), r.centerY().toFloat()) }
                  gesture(p, 60)
              }

              private fun findList(root: AccessibilityNodeInfo): Rect? {
                  var best: Rect? = null
                  fun walk(n: AccessibilityNodeInfo) {
                      if (n.isScrollable) {
                          val r = Rect()
                          n.getBoundsInScreen(r)
                          if (r.height() > (best?.height() ?: 0)) best = r
                      }
                      for (i in 0 until n.childCount) {
                          val c = n.getChild(i) ?: continue
                          walk(c)
                      }
                  }
                  walk(root)
                  return best
              }

              private suspend fun swipe(list: Rect, bottom: Int, older: Boolean) {
                  val top = list.top
                  val h = (bottom - top).toFloat()
                  val x = list.left + list.width() * 0.5f
                  val y1 = if (older) top + h * 0.3f else top + h * 0.7f
                  val y2 = if (older) top + h * 0.7f else top + h * 0.3f
                  val p = Path().apply {
                      moveTo(x, y1)
                      lineTo(x, y2)
                  }
                  gesture(p, 500)
              }

              private suspend fun gesture(path: Path, duration: Long): Boolean =
                  suspendCancellableCoroutine { cont ->
                      val g = GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(path, 0, duration))
                          .build()
                      val ok = dispatchGesture(g, object : AccessibilityService.GestureResultCallback() {
                          override fun onCompleted(gestureDescription: GestureDescription?) {
                              if (cont.isActive) cont.resume(true)
                          }

                          override fun onCancelled(gestureDescription: GestureDescription?) {
                              if (cont.isActive) cont.resume(false)
                          }
                      }, null)
                      if (!ok && cont.isActive) cont.resume(false)
                  }

              // ---------------------------------------------------------------- floating panel

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun preview(s: String): String {
                  val t = s.replace("\n", " ")
                  return if (t.length > 22) t.take(22) + "…" else t
              }

              private fun setStatus(t: String) {
                  if (::status.isInitialized) status.text = t
              }

              private fun mkBtn(label: String, onClick: () -> Unit): Button = Button(this).apply {
                  text = label
                  textSize = 12f
                  isAllCaps = false
                  minHeight = 0
                  minimumHeight = 0
                  minWidth = 0
                  minimumWidth = 0
                  setPadding(dp(6), dp(8), dp(6), dp(8))
                  setOnClickListener { onClick() }
              }

              private fun addTo(row: LinearLayout, b: View) {
                  row.addView(
                      b,
                      LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                          setMargins(dp(2), 0, dp(2), 0)
                      }
                  )
              }

              private fun buildPanel() {
                  val dm = resources.displayMetrics
                  val bg = GradientDrawable().apply {
                      setColor(Color.parseColor("#EE1F2C34"))
                      cornerRadius = dp(16).toFloat()
                  }
                  panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = bg
                      setPadding(dp(8), dp(6), dp(8), dp(8))
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                  }

                  status = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      text = "جاهز: اضغط ضغطة طويلة على أول رسالة ثم \"بداية\"  (اسحب من هنا لتحريك اللوحة)"
                      setPadding(dp(4), dp(2), dp(4), dp(6))
                  }
                  panel.addView(status)

                  row1 = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  addTo(row1, mkBtn("بداية") { onStart() })
                  addTo(row1, mkBtn("نهاية") { onEnd() })
                  addTo(row1, mkBtn("نسخ") { onCopy() })
                  panel.addView(row1)

                  val row2 = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, dp(4), 0, 0)
                  }
                  btnReact = mkBtn("تفاعل: ⛔") {
                      reactOn = !reactOn
                      btnReact.text = if (reactOn) "تفاعل: ✅" else "تفاعل: ⛔"
                  }
                  btnEmoji = mkBtn(EMOJIS[0]) {
                      emojiIdx = (emojiIdx + 1) % EMOJIS.size
                      btnEmoji.text = EMOJIS[emojiIdx]
                  }
                  btnStop = mkBtn("إيقاف") { onStop() }
                  btnStop.visibility = View.GONE
                  addTo(row2, btnReact)
                  addTo(row2, btnEmoji)
                  addTo(row2, btnStop)
                  panel.addView(row2)

                  lp = WindowManager.LayoutParams(
                      (dm.widthPixels * 0.92).toInt(),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.LEFT
                      x = (dm.widthPixels * 0.04).toInt()
                      y = dm.heightPixels - dp(260)
                  }

                  status.setOnTouchListener(object : View.OnTouchListener {
                      var sx = 0f
                      var sy = 0f
                      var ox = 0
                      var oy = 0
                      override fun onTouch(v: View, ev: MotionEvent): Boolean {
                          when (ev.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  sx = ev.rawX
                                  sy = ev.rawY
                                  ox = lp.x
                                  oy = lp.y
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  lp.x = ox + (ev.rawX - sx).toInt()
                                  lp.y = oy + (ev.rawY - sy).toInt()
                                  if (shown) wm.updateViewLayout(panel, lp)
                              }
                          }
                          return true
                      }
                  })
              }

              private fun setRunningUi(running: Boolean) {
                  row1.visibility = if (running) View.GONE else View.VISIBLE
                  btnReact.visibility = if (running) View.GONE else View.VISIBLE
                  btnEmoji.visibility = if (running) View.GONE else View.VISIBLE
                  btnStop.visibility = if (running) View.VISIBLE else View.GONE
              }

              private fun showPanel() {
                  if (shown) return
                  try {
                      wm.addView(panel, lp)
                      shown = true
                  } catch (_: Exception) {
                  }
              }

              private fun hidePanel() {
                  if (!shown) return
                  try {
                      wm.removeView(panel)
                  } catch (_: Exception) {
                  }
                  shown = false
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ناسخ الرسائل - نسخة ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
